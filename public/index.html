<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMIGA MegaDemo Player</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #04060a; }
      #app { width: 100vw; height: 100vh; position: relative; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; background: black; }
      #ui { position: absolute; inset: 0; pointer-events: none; }
      #panel { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
      .chip { border: 1px solid rgba(255,255,255,0.18); background: rgba(0,0,0,0.35); color: #eaf7ff; border-radius: 10px; padding: 8px 10px; font-size: 12px; text-shadow: 0 0 8px rgba(130,200,255,0.9); box-shadow: 0 0 10px rgba(0,180,255,0.15); }
      #hint { position: absolute; bottom: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
      .mini { font-size: 12px; color: #d8efff; opacity: 0.9; }
      .hidden { opacity: 0; transition: opacity 180ms ease; }
      .visible { opacity: 1; }
      .crt::after { content:""; position:absolute; inset:0; pointer-events:none; background: linear-gradient(rgba(255,255,255,0.03), rgba(255,255,255,0.02) 50%, rgba(0,0,0,0.08) 50%, rgba(0,0,0,0.02)); background-size: 100% 4px; mix-blend-mode: screen; opacity: 0.18; }
    </style>
  </head>
  <body>
    <div id="app" class="crt">
      <canvas id="glcanvas"></canvas>
      <div id="ui">
        <div id="panel">
          <div class="chip" id="modeChip">Mode: Normal</div>
          <div class="chip" id="demoChip">Demo: Plasma</div>
        </div>
        <div id="hint">
          <div class="mini">Tab / F1: UI toggle · Space: test mode · M: music mute</div>
          <div class="mini">AMIGA MegaDemo Player</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
